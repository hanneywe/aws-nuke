service: eks
resource: clusters
resourceName: EKSCluster
scope: account
sdkPackage: eks
svcType: concrete

list:
  strategy: flat
  operation: ListClusters
  pagination: paginator
  itemsField: Clusters
  describe:
    operation: DescribeCluster
    inputMapping:
      Name: cluster
    responseField: Cluster

delete:
  operation: DeleteCluster
  inputFields:
    - Name

fields:
  - name: Name
    type: "*string"
    fromList: cluster
  - name: CreatedAt
    type: "*time.Time"
    fromDescribe: CreatedAt
  - name: Tags
    type: "map[string]string"
    fromDescribe: Tags
  - name: protection
    type: "*bool"
    fromDescribe: DeletionProtection
    exported: false

settings:
  - name: DisableDeletionProtection
    protectionField: protection
    disableOperation: UpdateClusterConfig
    disableInput:
      Name: Name
      DeletionProtection: false

stringRepresentation:
  field: Name
