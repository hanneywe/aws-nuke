service: grafana-v2
resource: workspace-service-account
resourceName: GrafanaWorkspaceServiceAccount
scope: account
sdkPackage: grafana

list:
  strategy: nested
  levels:
    - operation: ListWorkspaces
      pagination: nextToken
      itemsField: Workspaces
      itemType: WorkspaceSummary
      iteratorVar: workspace
    - operation: ListWorkspaceServiceAccounts
      pagination: nextToken
      itemsField: ServiceAccounts
      itemType: ServiceAccountSummary
      iteratorVar: sa
      parentInputMapping:
        WorkspaceId: workspace.Id

delete:
  operation: DeleteWorkspaceServiceAccount
  inputFields:
    - WorkspaceId
    - ServiceAccountId

fields:
  - name: WorkspaceId
    type: "*string"
    fromList: workspace.Id
    propertyTag: 'name=WorkspaceId'
  - name: ServiceAccountId
    type: "*string"
    fromList: sa.Id
    propertyTag: 'name=ServiceAccountId'
  - name: Name
    type: "*string"
    fromList: sa.Name

stringRepresentation:
  field: Name
