service: grafana-v2
resource: workspace-service-account-token
resourceName: GrafanaWorkspaceServiceAccountToken
scope: account
sdkPackage: grafana

list:
  strategy: nested
  levels:
    - operation: ListWorkspaces
      pagination: nextToken
      itemsField: Workspaces
      itemType: WorkspaceSummary
      iteratorVar: workspace
    - operation: ListWorkspaceServiceAccounts
      pagination: nextToken
      itemsField: ServiceAccounts
      itemType: ServiceAccountSummary
      iteratorVar: sa
      parentInputMapping:
        WorkspaceId: workspace.Id
    - operation: ListWorkspaceServiceAccountTokens
      pagination: nextToken
      itemsField: ServiceAccountTokens
      itemType: ServiceAccountTokenSummary
      iteratorVar: token
      parentInputMapping:
        WorkspaceId: workspace.Id
        ServiceAccountId: sa.Id

delete:
  operation: DeleteWorkspaceServiceAccountToken
  inputFields:
    - WorkspaceId
    - ServiceAccountId
    - TokenId

fields:
  - name: WorkspaceId
    type: "*string"
    fromList: workspace.Id
    propertyTag: 'name=WorkspaceId'
  - name: ServiceAccountId
    type: "*string"
    fromList: sa.Id
    propertyTag: 'name=ServiceAccountId'
  - name: TokenId
    type: "*string"
    fromList: token.Id
    propertyTag: 'name=TokenId'
  - name: Name
    type: "*string"
    fromList: token.Name

stringRepresentation:
  field: Name
